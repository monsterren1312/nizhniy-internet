name: Архив GTA 6

on:
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Сколько постов за запуск"
        default: "40"
      days:
        description: "За сколько дней"
        default: "30"
      pause_sec:
        description: "Пауза между постами, сек"
        default: "240"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run backfill
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANNEL_URL: ${{ secrets.CHANNEL_URL }}
          BACKFILL_MAX_POSTS: ${{ inputs.max_posts }}
          BACKFILL_DAYS: ${{ inputs.days }}
          BACKFILL_PAUSE_SEC: ${{ inputs.pause_sec }}
        run: python backfill.py
