name: Тест ЛС с видео

on:
  workflow_dispatch: {}

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Send test
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for id in 546244209 7985229327; do
            echo "== $id copyMessage"
            curl -s "https://api.telegram.org/bot$TOKEN/copyMessage" -d chat_id=$id -d from_chat_id=@mir_gta6 -d message_id=311 --data-urlencode "caption= "
            echo
            echo "== $id info"
            curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id=$id --data-urlencode "text=🎬 Тест: видео-слив Cyberleek выше. Источник: https://t.me/mir_gta6/311"  | cut -c1-120
            echo
          done
