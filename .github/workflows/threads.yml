name: Threads Автопостер

on:
  workflow_dispatch:
    inputs:
      force_latest:
        description: "force latest post (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run Threads bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANNEL_URL: ${{ secrets.CHANNEL_URL }}
          THREADS_STATE_FILE: state/threads_seen.json
          STATE_FILE: state/threads_seen.json
          THREADS_FORCE_LATEST: ${{ github.event.inputs.force_latest }}
        run: python threads_bot.py
